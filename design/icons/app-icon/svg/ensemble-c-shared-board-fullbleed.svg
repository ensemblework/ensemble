<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="100 100 824 824">
  <title>Ensemble app icon: concept C, Shared board</title>
  <desc>A three-column task board: your card (paper) and the agent's card (violet) joined by one thread.</desc>
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b261f"/>
