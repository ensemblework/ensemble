<svg color="#000000" xmlns="http://www.w3.org/2000/svg" class="ut mono done " width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><style>/* Tray icon states. Scoped to .ut (the icon root). Works inline and inside standalone SVG files. */
.ut { overflow: visible; }
.ut .o, .ut .i { fill: none; stroke-linecap: round; }
.ut .o { stroke-width: 2.2; } .ut .i { stroke-width: 1.8; }
.ut.color .o { stroke: #9d8fff; } .ut.color .i { stroke: #f3eee6; }
.ut.color.on-light .i { stroke: #1c1915; } .ut.color.on-light .o { stroke: #6c5ce7; }
.ut.mono .o, .ut.mono .i { stroke: currentColor; }
.ut .badge, .ut .ping, .ut .bead, .ut .tick { display: none; }
/* working: dashes chase in opposite directions (two voices, one braid) */
.ut.working .o { stroke-dasharray: 5 2.2; animation: ut-chase 1.1s linear infinite; }
.ut.working .i { stroke-dasharray: 3.2 1.6; animation: ut-chase-r 1.1s linear infinite; }
@keyframes ut-chase { to { stroke-dashoffset: -7.2; } } @keyframes ut-chase-r { to { stroke-dashoffset: 4.8; } }
/* syncing: a bead runs the U */
.ut.syncing .o, .ut.syncing .i { opacity: .45; } .ut.syncing .bead { display: inline; }
/* needs you: amber badge with a ping */
.ut.needs .badge, .ut.needs .ping { display: inline; fill: #e0a04a; } .ut.mono.needs .badge, .ut.mono.needs .ping { fill: currentColor; }
.ut.needs .ping { transform-box: fill-box; transform-origin: center; animation: ut-ping 1.6s cubic-bezier(.2,.8,.2,1) infinite; }
@keyframes ut-ping { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(2.6); opacity: 0; } }
/* listening: the inner strand bobs like a level meter */
.ut.listening .i { transform-box: view-box; transform-origin: 12px 14px; animation: ut-bob .9s cubic-bezier(.45,0,.55,1) infinite alternate; }
.ut.listening .o { animation: ut-bob2 1.3s cubic-bezier(.45,0,.55,1) infinite alternate; transform-box: view-box; transform-origin: 12px 17.6px; }
@keyframes ut-bob { from { transform: scaleY(.7); } to { transform: scaleY(1.08); } } @keyframes ut-bob2 { from { transform: scaleY(.94); } to { transform: scaleY(1.02); } }
/* paused: strands parted at the bottom */
.ut.paused .o { stroke-dasharray: 14.55 3.2 20; } .ut.paused .i { stroke-dasharray: 9.15 3 20; } .ut.paused { opacity: .75; }
/* done: a tick pops, then settles away */
.ut.done .tick { display: inline; fill: #3cba86; transform-box: fill-box; transform-origin: center; animation: ut-tick 2.4s cubic-bezier(.3,1.6,.5,1) infinite; }
.ut.mono.done .tick { fill: currentColor; }
.ut.done .tick path { fill: none; stroke: #141210; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
@keyframes ut-tick { 0% { transform: scale(0); } 18%, 80% { transform: scale(1); } 100% { transform: scale(0); } }
/* error: red badge, strands shiver once per cycle */
.ut.error .badge { display: inline; fill: #e36b64; } .ut.mono.error .badge { fill: currentColor; }
.ut.error .o, .ut.error .i { animation: ut-shiver 2.4s ease-in-out infinite; }
@keyframes ut-shiver { 0%, 12%, 100% { transform: none; } 3% { transform: translateX(-.8px); } 6% { transform: translateX(.8px); } 9% { transform: translateX(-.5px); } }
/* offline: dotted and faint */
.ut.offline .o, .ut.offline .i { stroke-dasharray: 1.2 2.2; opacity: .5; }
@media (prefers-reduced-motion: reduce) { .ut * { animation: none !important; } .ut .bead { display: none !important; } }
.ut.mono.done .tick circle { display: none; } .ut.mono.done .tick path { stroke: currentColor; stroke-width: 1.7; }
[data-reduce-motion="true"] .ut * { animation: none !important; } [data-reduce-motion="true"] .ut .bead { display: none !important; }
</style><path class="o" d="M6.5 4.5v7.5a5.5 5.5 0 0 0 11 0V4.5"/><path class="i" d="M10 4.5v7.5a2 2 0 0 0 4 0V4.5"/><circle class="bead" r="1.7" fill="currentColor"><animateMotion dur="1.4s" repeatCount="indefinite" path="M6.5 4.5v7.5a5.5 5.5 0 0 0 11 0V4.5" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .55 1"/></circle><circle class="ping" cx="20.2" cy="4.2" r="2.6"/><circle class="badge" cx="20.2" cy="4.2" r="2.8"/><g class="tick"><circle cx="19.6" cy="4.6" r="3.6"/><path d="M17.9 4.7l1.2 1.1 2.2-2.4"/></g></svg>