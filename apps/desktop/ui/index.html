<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ensemble</title>
    <meta name="theme-color" content="#10282B" />
    <link rel="stylesheet" href="morph.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="ub">
    <header class="ub-top">
      <span class="ub-brand">
        <img src="woven-satin.svg" width="28" height="28" alt="" />
        <span>Ensemble</span>
      </span>
    </header>
    <main class="ub-main">
      <div id="loading" class="ub-card" hidden>
        <!-- data-delay is the brand.morph loader wait. ensemble-morph.js reads it; app.js does not repeat the number. -->
        <span id="loader" class="u-morph" data-motion-slot="brand.morph" data-size="72" data-loader data-delay="180" data-state="idle" aria-hidden="true"></span>
        <p id="loading-status" class="ub-p" role="status">Connecting…</p>
      </div>
      <div id="welcome" class="ub-card ub-wide" hidden>
        <p class="ub-code">welcome</p>
        <h1 class="ub-h">How do you want to use Ensemble?</h1>
        <p id="welcome-note" class="ub-p ub-p-wide"></p>
        <div class="ub-choices">
          <button id="choose-account" class="ub-choice" type="button">
            <span class="ub-choice-title">With your Ensemble account</span>
            <span class="ub-choice-text">Pages, tasks and agents stay in sync with the web app and your other devices. This computer runs the tasks you give your agents, and Ensemble's included AI models are available.</span>
            <span class="ub-choice-action">Sign in with your browser</span>
          </button>
          <button id="choose-local" class="ub-choice" type="button">
            <span class="ub-choice-title">Only on this computer</span>
            <span class="ub-choice-text">Everything stays in a database on this computer and Ensemble's servers are never used. Use your own AI subscriptions and API keys. You can move to an account later, once.</span>
            <span class="ub-choice-action">Keep everything local</span>
          </button>
        </div>
        <p id="welcome-status" class="ub-status" role="status"></p>
      </div>
      <div id="account" class="ub-card" hidden>
        <p class="ub-code">account</p>
        <h1 id="account-heading" class="ub-h">Move to your Ensemble account</h1>
        <p id="account-text" class="ub-p"></p>
        <label id="move-row" class="ub-check" hidden>
          <input id="move" type="checkbox" checked />
          <span>Move this computer's data into the account<span id="account-counts" class="ub-check-note"></span></span>
        </label>
        <div class="ub-row">
          <button id="account-start" class="ub-btn pri" type="button">Continue in your browser</button>
          <button id="account-back" class="ub-btn" type="button">Back</button>
        </div>
        <p id="account-status" class="ub-status" role="status"></p>
      </div>
      <div id="signin" class="ub-card" hidden>
        <p class="ub-code">sign in</p>
        <h1 id="signin-heading" class="ub-h">Approve in your browser</h1>
        <p id="signin-text" class="ub-p">Your browser opened Ensemble. Check that it shows this code, then approve.</p>
        <p id="signin-code" class="ub-big-code" aria-label="Sign-in code"></p>
        <div id="signin-progress" class="ub-progress" hidden><span></span></div>
        <p id="signin-status" class="ub-status" role="status" aria-live="polite"></p>
        <div class="ub-row">
          <button id="signin-open" class="ub-btn" type="button">Open the browser again</button>
          <button id="signin-cancel" class="ub-btn" type="button">Cancel</button>
        </div>
      </div>
      <div id="offline" class="ub-card" hidden>
        <img class="ub-art" src="woven-satin.svg" width="160" height="160" alt="Ensemble" />
        <p id="eyebrow" class="ub-code">offline</p>
        <h1 id="heading" class="ub-h">You’re offline.</h1>
        <p id="message" class="ub-p"></p>
        <form id="server-form" class="ub-form">
          <label for="url">Server URL</label>
          <input id="url" name="url" type="url" inputmode="url" autocomplete="url" spellcheck="false" required placeholder="http://localhost:3000" />
          <p id="source" class="ub-note"></p>
          <p id="status" class="ub-status" role="status"></p>
          <button id="connect" class="ub-btn pri" type="submit">Try again</button>
        </form>
      </div>
    </main>
    <footer class="ub-foot">Ensemble · A shared workspace for you and your agent.</footer>
    <script src="ensemble-morph.js"></script>
    <script src="app.js"></script>
  </body>
</html>
