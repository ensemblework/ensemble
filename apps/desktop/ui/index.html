<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ensemble</title>
    <meta name="theme-color" content="#10282B" />
    <link rel="stylesheet" href="morph.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="ub">
    <header class="ub-top">
      <span class="ub-brand">
        <img src="woven-satin.svg" width="28" height="28" alt="" />
        <span>Ensemble</span>
      </span>
    </header>
    <main class="ub-main">
      <div id="loading" class="ub-card" hidden>
        <!-- data-delay is the brand.morph loader wait. ensemble-morph.js reads it; app.js does not repeat the number. -->
        <span id="loader" class="u-morph" data-motion-slot="brand.morph" data-size="72" data-loader data-delay="180" data-state="idle" aria-hidden="true"></span>
        <p id="loading-status" class="ub-p" role="status">Connecting…</p>
      </div>
      <div id="offline" class="ub-card" hidden>
        <img class="ub-art" src="woven-satin.svg" width="160" height="160" alt="Ensemble" />
        <p id="eyebrow" class="ub-code">offline</p>
        <h1 id="heading" class="ub-h">You’re offline.</h1>
        <p id="message" class="ub-p"></p>
        <form id="server-form" class="ub-form">
          <label for="url">Server URL</label>
          <input id="url" name="url" type="url" inputmode="url" autocomplete="url" spellcheck="false" required placeholder="http://localhost:3000" />
          <p id="source" class="ub-note"></p>
          <p id="status" class="ub-status" role="status"></p>
          <button id="connect" class="ub-btn pri" type="submit">Try again</button>
        </form>
      </div>
    </main>
    <footer class="ub-foot">Ensemble · A shared workspace for you and your agent.</footer>
    <script src="ensemble-morph.js"></script>
    <script src="app.js"></script>
  </body>
</html>
