<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="100 100 824 824">
  <title>Ensemble app icon: concept B, Two voices</title>
  <desc>A U monogram made of two parallel strands, violet (the agent) and paper (you), moving as one.</desc>
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b261f"/>
      <stop offset="1" stop-color="#141210"/>
    </linearGradient>
    <radialGradient id="b-wash" cx="0.18" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#7c6af7" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#7c6af7" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#7c6af7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="b-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <defs>
    <linearGradient id="b-outer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d8fff"/>
      <stop offset="1" stop-color="#7c6af7"/>
    </linearGradient>
  </defs>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#b-bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#b-wash)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#b-rim)" stroke-width="3"/>
  <path d="M316 300 V540 A196 196 0 0 0 708 540 V300" fill="none" stroke="url(#b-outer)" stroke-width="84" stroke-linecap="round"/>
  <path d="M426 300 V540 A86 86 0 0 0 598 540 V300" fill="none" stroke="#f3eee6" stroke-width="64" stroke-linecap="round"/>
</svg>
