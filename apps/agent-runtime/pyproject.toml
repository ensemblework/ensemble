[project]
name = "ensemble-agent-runtime"
version = "0.1.0"
description = "Ensemble agent orchestration and guarded tool execution"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "structlog>=24.4",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "cryptography>=43",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "xlwt>=1.3",
  "odfpy>=1.4",
  "numbers-parser>=4.12",
  "pyarrow>=17",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "seaborn>=0.13",
  "scipy>=1.13",
]

[project.scripts]
ensemble-agent = "ensemble_agent.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ensemble_agent*"]
