name: desktop

on:
  pull_request:
    branches-ignore: [testing]
  workflow_dispatch:
    inputs:
      target:
        description: Desktop target to build (recovery builds do not publish a release).
        type: choice
        default: all
        options: [all, macos-arm64, macos-x64, windows, linux]
      recovery_source_run:
        description: Original tagged build run for packaging recovery (leave empty to build).
        type: string
        default: ''
      recovery_intel_run:
        description: Successful Intel-only recovery run (leave empty to build).
        type: string
        default: ''
  push:
    branches:
      - desktop
    # A desktop-v* tag matching apps/desktop/src-tauri/tauri.conf.json publishes the installers as a GitHub release.
    tags:
      - "desktop-v*"

# Published updater packages require TAURI_SIGNING_PRIVATE_KEY.
# There is no Apple, Windows, or Linux code-signing certificate in this workflow.
permissions:
  contents: read
  actions: write

jobs:
  targets:
    if: ${{ !inputs.recovery_source_run && !inputs.recovery_intel_run }}
    name: Select desktop targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: select
        shell: bash
        env:
          REQUESTED_TARGET: ${{ inputs.target || 'all' }}
        run: printf 'matrix=%s\n' "$(node scripts/desktop-targets.mjs "$REQUESTED_TARGET")" >> "$GITHUB_OUTPUT"
  build:
    name: ${{ matrix.name }}
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 12.6.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux system libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Install the workspace
        run: pnpm install --frozen-lockfile

      # The Linux sidecar bundles landrun (the Landlock sandbox helper), built from pinned source.
      - uses: actions/setup-go@v6.4.0
        if: matrix.os == 'ubuntu-22.04'
        with:
          go-version: "1.24.x"
          cache: false

      # next/font fetches Google Fonts while building. That fetch sometimes gets an odd reply on
      # hosted runners ("Cannot read properties of null" in the font loader), so one retry.
      - name: Export the desktop UI
        shell: bash
        run: node scripts/export-desktop-web.mjs || (echo "Export failed once; retrying." && sleep 20 && node scripts/export-desktop-web.mjs)

      - name: Assemble the local API sidecar
        env:
          ENSEMBLE_REQUIRE_LANDRUN: ${{ matrix.os == 'ubuntu-22.04' && '1' || '' }}
        run: node scripts/assemble-desktop-sidecar.mjs

      - name: Updater signing
        id: signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "config=--config src-tauri/tauri.signing.json" >> "$GITHUB_OUTPUT"
          else
            echo "config=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} ${{ steps.signing.outputs.config }}

      - name: Package the Intel Mac disk image
        if: matrix.name == 'macos-x64'
        run: node scripts/package-mac-dmg.mjs x86_64-apple-darwin

      - name: Upload bundles
        uses: actions/upload-artifact@v6
        with:
          name: ensemble-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/**/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/**/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/**/bundle/**/*.sig

  publish:
    name: Publish the desktop release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the app's version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          if [[ "${GITHUB_REF_NAME#desktop-v}" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v7
        with:
          pattern: ensemble-desktop-*
          path: bundles

      - name: Assemble and publish signed desktop updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/desktop-release.mjs bundles
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/dev/null 2>&1; then
            [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" == "true" ]] || { echo "This release is already published." >&2; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Ensemble desktop ${GITHUB_REF_NAME#desktop-v}" --notes "Ensemble for Apple silicon and Intel Macs, Windows and Linux. Includes the local workspace and signed in-app updates. OS code-signing certificates are not yet configured."
          fi
          node scripts/desktop-release.mjs bundles --upload
          gh release edit "$GITHUB_REF_NAME" --draft=false

  # Escape and trust tests. The Seatbelt cases skip everywhere except macOS.
  # No Postgres: these files do not open a database.
  seatbelt:
    if: ${{ !inputs.recovery_source_run && !inputs.recovery_intel_run }}
    name: macOS sandbox escapes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 12.6.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install the workspace
        run: pnpm install --frozen-lockfile

      - name: Escape, trust, planted, and git-gate tests
        working-directory: apps/hub-api
        env:
          DATABASE_URL: postgresql://localhost/ensemble_unused
        run: pnpm exec tsx --test src/workspace/sandbox/escape.test.ts src/workspace/trust.test.ts src/workspace/planted.test.ts src/workspace/git-gate.test.ts

      - name: Verify the Mac installer packager
        run: node --test scripts/package-mac-dmg.test.mjs

  recovery-publish:
    name: Publish verified desktop recovery
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.recovery_source_run || inputs.recovery_intel_run)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify source, signatures and publish the complete installer set
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_SOURCE_RUN: ${{ inputs.recovery_source_run }}
          RECOVERY_INTEL_RUN: ${{ inputs.recovery_intel_run }}
        run: node scripts/publish-desktop-recovery.mjs
