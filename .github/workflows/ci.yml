name: ci

# Every pull request into main (a feature branch or testing) and every push to main runs the same
# fast checks as testing (.github/actions/fast-checks). deploy.yml waits for this workflow to pass
# on main before it ships anything. The slower suites are paused in full-checks.yml
# (docs/37_PAUSED_CHECKS.md).
on:
  pull_request:
    branches-ignore: [testing]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # This name is the required status check on main and on the production branch.
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/fast-checks
