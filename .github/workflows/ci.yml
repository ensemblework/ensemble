name: ci

# Every pull request and every push to main. deploy.yml waits for this
# workflow to pass on main before it ships anything.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 12.6.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma's generated client is part of hub-api's types.
      - run: pnpm db:generate

      - run: pnpm typecheck

      # Connector logos are built from components/connectors/brands; the generated modules must match.
      - run: node scripts/build-brand-logos.mjs --check

      - name: Verify Ensemble brand assets
        run: |
          pnpm brand:check
          node scripts/check-icons.mjs
          pnpm --filter @ensemble/brand test

      - name: Package tests
        run: |
          pnpm --filter @ensemble/shared-types test
          pnpm --filter @ensemble/block-diagrams test
          pnpm --filter @ensemble/ide-theme test
          node --test scripts/desktop-release.test.mjs scripts/release-version.test.mjs

      # The plots preview test renders the same figure with the agent runtime's matplotlib.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/agent-runtime/pyproject.toml

      - run: pip install -e apps/agent-runtime

      - name: hub-web tests
        run: PLOTS_PYTHON="$(command -v python)" pnpm --filter @ensemble/hub-web test

  api:
    name: hub-api tests (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ensemble
          POSTGRES_PASSWORD: ensemble
          POSTGRES_DB: ensemble
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ensemble -d ensemble"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # A throwaway database that exists only for this job.
      DATABASE_URL: postgresql://ensemble:ensemble@127.0.0.1:5432/ensemble
      REDIS_URL: redis://127.0.0.1:6379
      # Read-only access to this repo for the gh CLI. The repo-overview test reads
      # Ensemble's own repo through GitHub, because Code refuses Ensemble's own folder.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 12.6.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same extensions infra/docker-compose.yml loads on first start.
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/sql/init.sql

      - run: pnpm db:generate

      - run: pnpm db:migrate

      # The Linux sandbox's Landlock helper, so the agent and remote e2e tests run sandboxed for real.
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.24.x"
          cache: false

      - name: Build the Landlock helper
        run: |
          node scripts/build-landrun.mjs --out "$RUNNER_TEMP/landrun/landrun"
          echo "ENSEMBLE_LANDRUN=$RUNNER_TEMP/landrun/landrun" >> "$GITHUB_ENV"

      - run: pnpm --filter @ensemble/hub-api test

      - name: Context Bridge (typecheck, MCP tests, build, smoke)
        run: pnpm bridge:verify

  # Live sandbox escapes on each OS's own sandbox. No Docker anywhere.
  sandbox:
    name: Sandbox escapes (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Seatbelt
            os: macos-latest
          - name: Linux Landlock
            os: ubuntu-24.04
            landrun: true
          - name: Linux bubblewrap
            os: ubuntu-22.04
            bubblewrap: true
          - name: Windows sandbox account
            os: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 12.6.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-go@v6.4.0
        if: matrix.landrun
        with:
          go-version: "1.24.x"
          cache: false

      - name: Build the Landlock helper
        if: matrix.landrun
        shell: bash
        run: |
          node scripts/build-landrun.mjs --out "$RUNNER_TEMP/landrun/landrun"
          echo "ENSEMBLE_LANDRUN=$RUNNER_TEMP/landrun/landrun" >> "$GITHUB_ENV"
          echo "ENSEMBLE_BWRAP=off" >> "$GITHUB_ENV"

      - name: Install bubblewrap (what a desktop distribution ships)
        if: matrix.bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Sandbox tests
        working-directory: apps/hub-api
        shell: bash
        env:
          DATABASE_URL: postgresql://localhost/ensemble_unused
          # The Windows runner is an administrator, so the one-time setup runs without a prompt.
          ENSEMBLE_SANDBOX_SETUP_IN_TEST: "1"
          ENSEMBLE_REQUIRE_OS_SANDBOX: "1"
        run: pnpm exec tsx --test src/workspace/sandbox/backends.test.ts src/workspace/sandbox/os-escape.test.ts src/workspace/trust.test.ts src/workspace/guard-git.test.ts

  cli:
    name: CLI tests and package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 12.6.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter ensemblework typecheck

      - run: pnpm --filter ensemblework test

      - run: pnpm --filter ensemblework build

      - name: Package smoke
        shell: bash
        run: |
          node scripts/package-cli.mjs --target linux-x64 --out dist/cli-smoke --skip-sidecar
          mkdir -p /tmp/ensemble-cli-smoke
          tar -xzf dist/cli-smoke/ensemble-cli-*-linux-x64.tar.gz -C /tmp/ensemble-cli-smoke
          node scripts/smoke-cli-package.mjs /tmp/ensemble-cli-smoke/ensemble --skip-mcp --skip-sidecar-health

  python:
    name: agent-runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/agent-runtime/pyproject.toml

      - run: pip install -e apps/agent-runtime pytest

      - working-directory: apps/agent-runtime
        run: python -m pytest -q tests

  build:
    name: Production builds (Hub and landing)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 12.6.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Placeholder origins: this only proves the build works. The real values
      # are set on the Vercel project and used by deploy.yml.
      - name: Hub (apps/hub-web)
        env:
          NEXT_PUBLIC_HUB_API: https://api.example.com
          NEXT_PUBLIC_SITE_URL: https://app.example.com
        run: pnpm --filter @ensemble/hub-web build

      - name: Landing page (apps/landing)
        run: pnpm --filter @ensemble/landing build
