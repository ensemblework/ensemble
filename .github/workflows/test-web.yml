name: test-web

on:
  push:
    branches: [testing]
  pull_request:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Web testing checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 12.6.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @ensemble/shared-types typecheck && pnpm --filter @ensemble/hub-api typecheck && pnpm --filter @ensemble/hub-web typecheck
      - name: Testing CLI boundary checks
        run: |
          pnpm --filter ensemblework typecheck
          pnpm --filter ensemblework exec node --import tsx --test src/testing-channel.test.ts src/paths.test.ts src/auth-flow.test.ts src/editors.test.ts src/launcher-update-services.test.ts
          pnpm --filter @ensemble/hub-api exec tsx --test src/remote/client-channel.test.ts
          node --test scripts/testing-cli.test.mjs
      - name: Focused web and API regressions
        run: |
          pnpm --filter @ensemble/hub-web exec node --import tsx --test components/motion/board-drag/board-move.test.tsx components/board/insights.test.tsx components/pages/pages-section.test.tsx components/comments/comment-layer.test.tsx lib/session-cookie.test.ts
          pnpm --filter @ensemble/hub-api exec tsx --test src/routes/page-boards.integration.test.ts src/routes/cookie-namespace.integration.test.ts src/lib/production.test.ts
          node --test infra/deploy/testing/deploy.test.mjs
          pnpm --filter @ensemble/hub-api route:inventory:check
  promote:
    name: Promote testing API
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/testing' && vars.TEST_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Advance only the newest tested commit
        env:
          SHA: ${{ github.sha }}
          API_URL: ${{ secrets.ENSEMBLE_TEST_API_URL }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse origin/testing)" != "$SHA" ]; then
            echo "A newer testing commit owns deployment."
            exit 1
          fi
          test -n "$API_URL"
          git push origin "$SHA:refs/heads/testing-live"
          deadline=$((SECONDS + 12 * 60))
          until [ "$(curl -fsS --max-time 10 "$API_URL/health" | jq -r '.commit // empty')" = "$SHA" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Testing API did not become ready at this commit."
              exit 1
            fi
            sleep 10
          done
          curl -fsS --max-time 15 -o /dev/null "$API_URL/health/ready"
  publish:
    name: Publish testing web app
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 12.6.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/vercel-deploy
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          org-id: ${{ secrets.VERCEL_ORG_ID }}
          project-id: ${{ secrets.VERCEL_PROJECT_ID_TEST }}
  testing-cli:
    name: Publish matching testing CLI
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/test-cli.yml
